name: Debug project parse

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/debug-project.yml'

jobs:
  debug:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Inspect bytes
        run: |
          F=builds/ios/Helm_iOS.xcodeproj/project.pbxproj
          head -c 120 "$F" | xxd | head -5
          echo "--- non-ascii bytes:"
          LC_ALL=C grep -n '[^ -~	]' "$F" | head -5 || echo none
          echo "--- tail:"
          tail -c 200 "$F" | xxd | tail -5

      - name: Try variants
        run: |
          set +e
          SRC=builds/ios/Helm_iOS.xcodeproj
          work=/tmp/variants
          rm -rf $work; mkdir -p $work

          try() {
            name=$1; dir=$work/$name
            mkdir -p "$dir/Helm.xcodeproj"
            cp "$dir/project.pbxproj" "$dir/Helm.xcodeproj/project.pbxproj" 2>/dev/null
            out=$(xcodebuild -list -project "$dir/Helm.xcodeproj" 2>&1)
            code=$?
            echo "=== $name -> exit $code"
            echo "$out" | tail -5
          }

          mkdir -p $work/original
          cp "$SRC/project.pbxproj" $work/original/project.pbxproj
          try original

          mkdir -p $work/ov46
          sed -e 's/objectVersion = 56;/objectVersion = 46;/' \
              -e 's/compatibilityVersion = "Xcode 14.0"/compatibilityVersion = "Xcode 3.2"/' \
              "$SRC/project.pbxproj" > $work/ov46/project.pbxproj
          try ov46

          python3 -m pip install --quiet --user pbxproj 2>&1 | tail -2
          mkdir -p $work/roundtrip
          PYTHONPATH=$(python3 -c 'import site,sys;print(site.USER_SITE)') python3 - <<'PY'
          from pbxproj import XcodeProject
          p = XcodeProject.load("builds/ios/Helm_iOS.xcodeproj/project.pbxproj")
          p.save("/tmp/variants/roundtrip/project.pbxproj")
          print("roundtrip saved")
          PY
          try roundtrip

          echo "=== project.xcworkspace present in desktop project:"
          ls -R builds/osx/Helm.xcodeproj | head -10
